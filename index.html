<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Claude</title>
<meta name="robots" content="noindex">
<style>
  /* Layout: one centred card, nothing else. Tokens first, dark via media query. */
  :root {
    --bg: #f6f5f2; --fg: #1f1d1a; --muted: #6b665e; --card: #ffffff; --line: #e2dfd8;
    --accent: #b5472b; --accent-fg: #ffffff;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #ece9e2; --muted: #a39d93; --card: #211f1c; --line: #35322d; --accent: #e0714f; --accent-fg: #171614; color-scheme: dark; }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; box-sizing: border-box; display: grid; gap: 16px; }
  h1 { font-size: 1.25rem; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  a.btn { display: block; text-align: center; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; padding: 12px 16px; border-radius: 8px; }
  a.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  code { display: block; font: 13px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
  button { font: inherit; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Claude…</h1>
  <p id="hint">If nothing happens, Chrome may be asking for permission in a dialog at the top of the window. Choose Open.</p>
  <a class="btn" id="open" href="#">Open in Claude</a>
  <code id="link"></code>
  <div><button id="copy" type="button">Copy link</button> <small id="copied" hidden>Copied</small></div>
  <small>Builds a <code style="display:inline;padding:1px 4px;white-space:normal">claude://code/new</code> link from the <em>folder</em> and <em>q</em> parameters in this page's address.</small>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var folder = params.get('folder') || '/Users/nathaniel/Projects/dev-fundamentals';
    var q = params.get('q') || "today's lesson";
    var link = 'claude://code/new?folder=' + encodeURIComponent(folder).replace(/%2F/g, '/') + '&q=' + encodeURIComponent(q);
    var a = document.getElementById('open');
    a.href = link;
    document.getElementById('link').textContent = link;
    document.getElementById('title').textContent = 'Opening Claude in ' + folder.split('/').pop() + '…';
    document.getElementById('copy').addEventListener('click', function () {
      var done = function () { document.getElementById('copied').hidden = false; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, done); else done();
    });
    setTimeout(function () { location.href = link; }, 300);
  })();
</script>
</body>
</html>
